---
rtpengine_ami_version: ''
rtpengine_ami_source_commit: ''
rtpengine_ami_source_tree: ''
rtpengine_ami_source_timestamp: ''
rtpengine_ami_source_sha256: ''
rtpengine_ami_source_archive: /tmp/rtpengine-source.tar.gz
rtpengine_ami_source_provenance: /tmp/rtpengine-source-provenance.json
rtpengine_ami_build_directory: /usr/local/src/rtpengine-ami-build
rtpengine_ami_source_directory: "{{ rtpengine_ami_build_directory }}/source"
rtpengine_ami_package_directory: "{{ rtpengine_ami_build_directory }}/approved"
rtpengine_ami_hold_kernel: true
rtpengine_ami_build_jobs: "{{ ansible_processor_vcpus | default(2) }}"
rtpengine_ami_bootstrap_build_packages:
  - build-essential
  - devscripts
  - equivs
  - fakeroot
  - file
  - pkgconf
rtpengine_ami_runtime_packages:
  - ca-certificates
  - iproute2
  - kmod
  - nftables
  - python3
rtpengine_ami_installed_packages:
  - rtpengine-daemon
  - rtpengine-utils
  - rtpengine-kernel-dkms

rtpengine_ami_advertised_address_tag: RtpEngineAdvertisedAddress
rtpengine_ami_table: 0
rtpengine_ami_no_fallback: true
rtpengine_ami_media_port_min: 30000
rtpengine_ami_media_port_max: 39999
rtpengine_ami_ng_port: 2223
rtpengine_ami_cli_port: 2224
rtpengine_ami_http_port: 2225
rtpengine_ami_nftables_family: ip
rtpengine_ami_nftables_chain: rtpengine
rtpengine_ami_nftables_base_chain: INPUT
rtpengine_ami_max_sessions: 5000
rtpengine_ami_log_level: 6
rtpengine_ami_tos: 184
rtpengine_ami_metadata_attempts: 12
rtpengine_ami_metadata_timeout: 2
rtpengine_ami_firstboot_timeout: 120
